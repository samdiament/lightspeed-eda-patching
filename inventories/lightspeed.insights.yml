---
plugin: redhat.insights.insights
authentication: service_account
selection: display_name
vars_prefix: insights_
staleness:
  - fresh
  - stale
compose:
  # Extract the non-loopback IPv4 address reported by insights-client
  ansible_host: >-
    {{
      (insights_ip_addresses | default([])
       | reject('equalto', '127.0.0.1')
       | reject('search', ':')
       | list)[0]
    }}
