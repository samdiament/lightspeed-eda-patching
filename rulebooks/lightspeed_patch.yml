---
- name: Remediate Specific CVEs from Red Hat Lightspeed
  hosts: localhost
  sources:
    - redhat.insights_eda.insights:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Patch Specific CVE Detected by Lightspeed
      condition: >-
        event.payload.source.application.display_name is defined and
        event.payload.source.application.display_name == "Vulnerability" and
        event.payload.source.event_type.display_name is defined and
        event.payload.source.event_type.display_name in ["System vulnerability", "New CVE", "Any CVE with known exploit"]
      action:
        run_workflow_template:
          name: "Lightspeed CVE Remediation Workflow"
          organization: "Default"
          job_args:
            limit: "{{ event.payload.context.display_name }}"
            extra_vars:
              target_host: "{{ event.payload.context.display_name }}"
              lightspeed_event_type: "{{ event.payload.source.event_type.display_name }}"
              lightspeed_severity: "{{ event.payload.severity | default('UNKNOWN') }}"
              lightspeed_host_url: "{{ event.payload.context.host_url | default('') }}"
              lightspeed_events: "{{ event.payload.events | default([]) }}"
          labels:
            - "Lightspeed-CVE-Patch"
            - "{{ event.payload.severity | default('Vulnerability') }}"
